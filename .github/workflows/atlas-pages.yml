name: ATLAS Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - sw.js
      - manifest.json
      - scripts/update_feeds.py
      - .github/workflows/atlas-pages.yml
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site and feeds
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          mkdir -p _site
          cp index.html app.js sw.js manifest.json _site/
          python3 scripts/update_feeds.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
